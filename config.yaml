# 装甲板识别参数配置
# 用调参工具调好后按 s 一键写入本文件，也可以直接手动修改

hsv:
  h_min: 94          # 色相下限 (0~179，蓝色约 95~130)
  h_max: 130          # 色相上限
  s_min: 123          # 饱和度下限
  v_min: 68          # 亮度下限
  diff_min: 53    # B-R 通道差下限，与 HSV 是“与”关系，双保险抗反光

detect:                   # 灯条筛选（数值按 1080p 像素）
  area_min: 100       # 轮廓最小面积，过小视为噪点
  area_max: 19802       # 轮廓最大面积，过大视为整片反光
  min_width: 3.0     # 灯条短边下限（像素），滤细丝噪点
  max_width: 60.0     # 灯条短边上限（像素），滤大块光斑/箱体
  min_aspect: 1.3   # 长宽比下限（太低不像灯条）
  max_aspect: 20.0   # 长宽比上限（太高是细丝噪声）
  min_fill: 0.25       # 面积 / 外接矩形面积，过滤空洞噪声
  max_tilt: 35.0       # 长轴与竖直方向夹角上限（度），滤横向灯带
  core_v: 245           # 实心灯条的芯部亮度下限（过曝接近 255，反光上不去）

match:                    # 双灯条配对
  min_len_ratio: 0.35   # 两灯条长度比下限
  max_angle_diff: 25.0 # 两灯条长轴夹角上限（度）
  min_ratio: 0.9           # 法向间距 / 平均灯长 下限
  max_ratio: 3.5           # 同上上限，防止跨板配对
  max_along: 0.6   # 沿轴错位 / 平均灯长 上限
